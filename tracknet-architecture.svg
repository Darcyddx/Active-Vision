<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa" />
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">TrackNet Model Architecture</text>
  
  <!-- Input -->
  <rect x="100" y="70" width="600" height="40" rx="5" fill="#b8daff" stroke="#3273dc" />
  <text x="400" y="95" font-family="Arial" font-size="14" text-anchor="middle">Input (9, 288, 512)</text>
  
  <!-- Encoder -->
  <rect x="150" y="130" width="200" height="300" rx="5" fill="#d1ecf1" stroke="#17a2b8" />
  <text x="250" y="150" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Encoder</text>
  
  <!-- Layers 1-2 -->
  <rect x="170" y="160" width="160" height="40" rx="3" fill="#bee5eb" stroke="#17a2b8" />
  <text x="250" y="185" font-family="Arial" font-size="12" text-anchor="middle">Conv 64 → ReLU → BN</text>
  
  <rect x="170" y="210" width="160" height="40" rx="3" fill="#bee5eb" stroke="#17a2b8" />
  <text x="250" y="235" font-family="Arial" font-size="12" text-anchor="middle">Conv 64 → ReLU → BN</text>
  
  <!-- Downsampling 1 -->
  <rect x="170" y="260" width="160" height="20" rx="3" fill="#adb5bd" stroke="#6c757d" />
  <text x="250" y="275" font-family="Arial" font-size="10" text-anchor="middle">MaxPooling (2x2)</text>
  
  <!-- Layers 4-5 -->
  <rect x="170" y="290" width="160" height="40" rx="3" fill="#bee5eb" stroke="#17a2b8" />
  <text x="250" y="315" font-family="Arial" font-size="12" text-anchor="middle">Conv 128 → ReLU → BN</text>
  
  <rect x="170" y="340" width="160" height="40" rx="3" fill="#bee5eb" stroke="#17a2b8" />
  <text x="250" y="365" font-family="Arial" font-size="12" text-anchor="middle">Conv 128 → ReLU → BN</text>
  
  <!-- Decoder -->
  <rect x="450" y="130" width="200" height="300" rx="5" fill="#f8d7da" stroke="#dc3545" />
  <text x="550" y="150" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Decoder</text>
  
  <!-- Layer 14-17 -->
  <rect x="470" y="160" width="160" height="40" rx="3" fill="#f5c6cb" stroke="#dc3545" />
  <text x="550" y="175" font-family="Arial" font-size="10" text-anchor="middle">UpSampling (2x2) + Concat</text>
  <text x="550" y="190" font-family="Arial" font-size="10" text-anchor="middle">Conv 256 → ReLU → BN</text>
  
  <rect x="470" y="210" width="160" height="40" rx="3" fill="#f5c6cb" stroke="#dc3545" />
  <text x="550" y="235" font-family="Arial" font-size="12" text-anchor="middle">Conv 256 → ReLU → BN</text>
  
  <rect x="470" y="260" width="160" height="40" rx="3" fill="#f5c6cb" stroke="#dc3545" />
  <text x="550" y="285" font-family="Arial" font-size="12" text-anchor="middle">Conv 256 → ReLU → BN</text>
  
  <!-- Layer 18-20 -->
  <rect x="470" y="310" width="160" height="40" rx="3" fill="#f5c6cb" stroke="#dc3545" />
  <text x="550" y="325" font-family="Arial" font-size="10" text-anchor="middle">UpSampling (2x2) + Concat</text>
  <text x="550" y="340" font-family="Arial" font-size="10" text-anchor="middle">Conv 128 → ReLU → BN</text>
  
  <rect x="470" y="360" width="160" height="40" rx="3" fill="#f5c6cb" stroke="#dc3545" />
  <text x="550" y="385" font-family="Arial" font-size="12" text-anchor="middle">Conv 128 → ReLU → BN</text>
  
  <!-- Middle section - Encoder lower half -->
  <rect x="150" y="440" width="200" height="70" rx="5" fill="#d1ecf1" stroke="#17a2b8" />
  
  <!-- Downsampling 2 -->
  <rect x="170" y="450" width="160" height="20" rx="3" fill="#adb5bd" stroke="#6c757d" />
  <text x="250" y="465" font-family="Arial" font-size="10" text-anchor="middle">MaxPooling (2x2)</text>
  
  <!-- Layers 7-9 -->
  <text x="250" y="485" font-family="Arial" font-size="10" text-anchor="middle">Conv 256 x3 → ReLU → BN</text>
  
  <!-- Middle section - Deeper encoder -->
  <rect x="150" y="520" width="200" height="40" rx="5" fill="#d1ecf1" stroke="#17a2b8" opacity="0.6" />
  <text x="250" y="545" font-family="Arial" font-size="10" text-anchor="middle">MaxPool → Conv 512 x3 → Deeper Layers</text>
  
  <!-- Middle section - Decoder lower half -->
  <rect x="450" y="440" width="200" height="70" rx="5" fill="#f8d7da" stroke="#dc3545" />
  
  <!-- Layer 21-23 -->
  <rect x="470" y="450" width="160" height="20" rx="3" fill="#f5c6cb" stroke="#dc3545" />
  <text x="550" y="465" font-family="Arial" font-size="10" text-anchor="middle">UpSampling (2x2) + Concat</text>
  
  <text x="550" y="485" font-family="Arial" font-size="10" text-anchor="middle">Conv 64 x2 → ReLU → BN</text>
  
  <!-- Output layer -->
  <rect x="150" y="520" width="500" height="30" rx="5" fill="#ffeeba" stroke="#ffc107" />
  <text x="400" y="540" font-family="Arial" font-size="12" text-anchor="middle">Conv 3 (1x1) → Sigmoid</text>
  
  <!-- Output -->
  <rect x="100" y="560" width="600" height="30" rx="5" fill="#b8daff" stroke="#3273dc" />
  <text x="400" y="580" font-family="Arial" font-size="14" text-anchor="middle">Output (3, 288, 512)</text>
  
  <!-- Skip connections -->
  <path d="M 250 230 L 400 230 L 400 465 L 470 465" fill="none" stroke="#6c757d" stroke-width="2" stroke-dasharray="5,5" />
  <path d="M 250 360 L 380 360 L 380 325 L 470 325" fill="none" stroke="#6c757d" stroke-width="2" stroke-dasharray="5,5" />
  <path d="M 250 485 L 360 485 L 360 175 L 470 175" fill="none" stroke="#6c757d" stroke-width="2" stroke-dasharray="5,5" />
</svg>
